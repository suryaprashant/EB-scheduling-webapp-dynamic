services:
  - type: web
    name: eb-scheduling-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGIN
        value: "*"
